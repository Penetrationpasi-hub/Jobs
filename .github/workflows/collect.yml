name: Daten sammeln

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install requests openpyxl

      - name: Daten abrufen
        env:
          DIP_API_KEY: ${{ secrets.DIP_API_KEY }}
        run: python collect_jobs.py

      - name: Ergebnisse committen
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Datenlauf $(date +%F)" || echo "keine Aenderungen"
          git push
