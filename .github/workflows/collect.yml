name: Daten sammeln

on:
  schedule:
    # 08:17 UTC: nach dem ScrapJobs-Lauf (06:05 Berlin, bis zu 2 h),
    # damit stellen.json vom selben Tag gelesen wird
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      kldb_probe:
        description: "BERUFENET-Rohantworten ins Log schreiben (Diagnose der KldB-Zuordnung)"
        type: boolean
        default: false

permissions:
  contents: write

# Nie zwei Laeufe gleichzeitig: ein zweiter Start wartet, bis der
# erste fertig ist. Parallele Laeufe erzeugen sonst Merge-Konflikte
# in den Daten-CSVs und der (binaeren, nie mergebaren) Excel.
concurrency:
  group: datenlauf
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      # Immer den AKTUELLEN Stand von main holen, nicht den Commit, der
      # den Lauf ausgeloest hat: ein Lauf, der per concurrency gewartet
      # hat, saehe sonst die Daten des vorherigen Laufs nicht und
      # scheitert beim Push an Konflikten (so am 18.11.2026).
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install openpyxl pytest

      - name: Umkreis und Auswertung pruefen
        run: python -m pytest -q

      # KldB-Code je Beruf (BERUFENET) fuer die Branchenanalyse; nur neue
      # Berufe, hoechstens KLDB_MAX je Lauf. Ein Ausfall stoppt den
      # Datenlauf nicht, dann greift der Stichwort-Rueckfall in branchen.py.
      - name: Berufe der KldB zuordnen
        continue-on-error: true
        timeout-minutes: 20
        run: |
          if [ "${{ inputs.kldb_probe }}" = "true" ]; then
            python tools/kldb_zuordnung.py --probe || true
          fi
          python tools/kldb_zuordnung.py

      # collect_jobs.REGIONS: Auswertung nur Waiblingen, 50 km Luftlinie.
      # Derselbe Arbeitsortfilter gilt fuer BA und den ScrapJobs-Import.
      # Zusaetzlich ARCHIV_REGIONS (alte Suchgebiete inkl. Aalen/Ostalb):
      # nur data/archiv_*.csv, nicht in der Excel. Abschalten: ARCHIV=0.
      - name: Waiblingen 50 km sammeln und auswerten
        env:
          GENESIS_TOKEN: ${{ secrets.GENESIS_TOKEN }}
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASS: ${{ secrets.GENESIS_PASS }}
          GENESIS_BASE: ${{ vars.GENESIS_BASE }}
          # Boersen-Stichprobe: Netlify fragt Adzuna, Google Jobs und Apify
          # selbst ab (Schluessel liegen dort). Hier nur die Adresse der
          # App als Repo-Variable (Settings > Variables), kein Secret.
          BOERSEN_URL: ${{ vars.BOERSEN_URL }}
        run: python collect_jobs.py

      - name: Ergebnisse committen
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Datenlauf $(date +%F)" || { echo "keine Aenderungen"; exit 0; }
          # Push mit Wiederholung: landet waehrend des Laufs ein Commit
          # auf main (z.B. eine Script-Aenderung), wird davor rebased.
          # Daten-Konflikte kann es dank concurrency nicht mehr geben.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || {
              git rebase --abort
              echo "::error::Rebase-Konflikt (Datendateien von Hand geaendert?) - Lauf neu starten."
              exit 1
            }
            sleep 5
          done
          git push
