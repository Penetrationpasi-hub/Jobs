name: Daten sammeln

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Nie zwei Laeufe gleichzeitig: ein zweiter Start wartet, bis der
# erste fertig ist. Parallele Laeufe erzeugen sonst Merge-Konflikte
# in den Daten-CSVs und der (binaeren, nie mergebaren) Excel.
concurrency:
  group: datenlauf
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pakete installieren
        run: pip install openpyxl

      - name: Sammeln und auswerten
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASS: ${{ secrets.GENESIS_PASS }}
        run: python collect_jobs.py

      - name: Ergebnisse committen
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Datenlauf $(date +%F)" || { echo "keine Aenderungen"; exit 0; }
          # Push mit Wiederholung: landet waehrend des Laufs ein Commit
          # auf main (z.B. eine Script-Aenderung), wird davor rebased.
          # Daten-Konflikte kann es dank concurrency nicht mehr geben.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main || {
              git rebase --abort
              echo "::error::Rebase-Konflikt (Datendateien von Hand geaendert?) - Lauf neu starten."
              exit 1
            }
            sleep 5
          done
          git push
